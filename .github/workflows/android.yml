name: Build debug APK

on:
  push:
    branches: [main, "phase*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dreamboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Export Room schema (re-run KSP so a cached result still writes the file)
        run: ./gradlew --no-daemon :app:kspDebugKotlin --rerun
      - name: Print Room schemas (for committing to app/schemas)
        run: for f in $(find app/schemas -name '*.json' 2>/dev/null); do echo "SCHEMA-FILE $f"; base64 -w0 "$f"; echo; done
      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: ignore
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dreamboard (latest debug build)
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
